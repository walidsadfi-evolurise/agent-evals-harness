[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evals-harness"
version = "0.1.0"
description = "Evaluate LLM agents like software: YAML cases, deterministic checks, optional LLM judge, repeated trials, latency percentiles, baseline regression detection, JUnit output and a CI gate."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Walid Sadfi", email = "walid.sadfi@evolurise.com" }]
requires-python = ">=3.11"
keywords = ["llm", "agents", "evals", "evaluation", "testing", "regression", "ci"]
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "types-jsonschema", "fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
agent-evals = "agentevals.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM"]
per-file-ignores = { "src/agentevals/cli.py" = ["B008"] }

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
packages = ["agentevals"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
