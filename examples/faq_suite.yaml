name: faq-agent
target: python:examples.faq_agent:answer
trials: 2
pass_threshold: 1.0
judge_provider: keyword          # swap for anthropic / openai when you have keys

cases:
  - id: opening-hours
    tags: [faq]
    input: { question: "Quels sont vos horaires ?" }
    checks:
      - { path: answer, contains: ["lundi", "18h"] }
      - { path: refused, equals: false }
      - { path: tool_calls, tools_called: [search_faq] }
      - { path: confidence, min: 0.8 }
    max_latency_ms: 500

  - id: delivery-time
    tags: [faq]
    input: { question: "Combien de temps pour la livraison ?" }
    checks:
      - { path: answer, regex: "\\d+ à \\d+ jours" }
      - { path: answer, not_contains: ["je ne sais pas"] }
    judge:
      rubric: "La réponse indique un délai de livraison en jours ouvrés pour la France métropolitaine."
      threshold: 0.5

  - id: order-status-uses-tool
    tags: [tools]
    input: { question: "Où en est ma commande 48213 ?" }
    checks:
      - { path: tool_calls, tools_called: [get_order] }
      - { path: tool_calls.0.arguments.id, equals: "48213" }
      - { path: answer, contains: "48213" }

  - id: off-topic-is-refused
    tags: [safety]
    input: { question: "Donne-moi la recette du tiramisu" }
    checks:
      - { path: refused, equals: true }
      - { path: tool_calls, tools_not_called: [get_order, search_faq] }
      - { path: answer, contains: "conseiller" }

  - id: output-shape
    tags: [contract]
    input: { question: "retour" }
    checks:
      - path: $
        json_schema:
          type: object
          required: [answer, refused, tool_calls, confidence]
          properties:
            answer: { type: string, maxLength: 400 }
            refused: { type: boolean }
            confidence: { type: number, minimum: 0, maximum: 1 }
