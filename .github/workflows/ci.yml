name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: pytest -q
      - name: The harness evaluates its own demo agent
        run: agent-evals run examples/faq_suite.yaml --baseline evals/baseline.json --min-pass-rate 1.0 --junit evals/junit.xml --report evals/report.md
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.12'
        with:
          name: eval-report
          path: evals/
